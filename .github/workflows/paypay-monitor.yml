
name: PayPay Link Monitor

on:
  workflow_dispatch:
  schedule:
  - cron: "* * * * *"
  

permissions:
  contents: write

concurrency:
  group: paypay-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser
     
      - name: Process Discord commands
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: python discord_commands.py

      - name: Monitor X users
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import hashlib
          import urllib.request
          import feedparser
          from html import unescape

          WEBHOOK = os.environ["DISCORD_WEBHOOK"]
          NITTER = "https://nitter.mie.foundation"

          # 監視ユーザーを読み込む
          with open("users.txt", encoding="utf-8") as f:
              users = [
                  line.strip().lstrip("@")
                  for line in f
                  if line.strip() and not line.strip().startswith("#")
              ]

          users = list(dict.fromkeys(
              u for u in users
              if re.fullmatch(r"[A-Za-z0-9_]{1,15}", u)
          ))

          # 過去に通知したリンク
          try:
              with open("seen.json", encoding="utf-8") as f:
                  seen = set(json.load(f))
          except FileNotFoundError:
              seen = set()

          def notify(message):
              data = json.dumps({
                  "content": message
              }).encode("utf-8")

              req = urllib.request.Request(
                  WEBHOOK,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "PayPayMonitor/1.0"
                  }
              )

              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError("Discord notification failed")

          detected = 0

          for user in users:
              feed_url = f"{NITTER}/{user}/rss"

              try:
                  req = urllib.request.Request(
                      feed_url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=30) as response:
                      feed = feedparser.parse(response.read())

                  if feed.bozo and not feed.entries:
                      print(f"Feed error: @{user}")
                      continue

                  print(f"Checking @{user}: {len(feed.entries)} posts")

                  for entry in feed.entries:
                      content = unescape(entry.get("title", ""))

                      content += " " + unescape(
                          entry.get("summary", "")
                      )

                      for item in entry.get("content", []):
                          content += " " + unescape(
                              item.get("value", "")
                          )

                      links = re.findall(
                          r'https?://pay\.paypay\.ne\.jp/[^\s<>"\']+',
                          content
                      )

                      post_url = entry.get("link", "")

                      # Nitterの投稿URLをXのURLに変換
                      post_url = re.sub(
                          r"https?://[^/]+/",
                          "https://x.com/",
                          post_url
                      )

                      for link in set(links):
                          link = link.rstrip(".,;!?)]}")

                          key = hashlib.sha256(
                              (post_url + link).encode()
                          ).hexdigest()

                          if key in seen:
                              continue

                          notify(
                              "🔔 PayPayリンクを検出！\n"
                              f"ユーザー: @{user}\n"
                              f"PayPayリンク: {link}\n"
                              f"投稿元: {post_url}"
                          )

                          seen.add(key)
                          detected += 1

              except Exception as e:
                  print(f"Error @{user}: {e}")

          # 重複チェック情報を保存
          with open("seen.json", "w", encoding="utf-8") as f:
              json.dump(sorted(seen)[-5000:], f)

          print(f"監視ユーザー数: {len(users)}")
          print(f"新規検出数: {detected}")
          PY

      - name: Save duplicate-check data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json users.txt discord_cursor.txt
          git diff --cached --quiet || (
            git commit -m "Update detected links"
            git push
          )

