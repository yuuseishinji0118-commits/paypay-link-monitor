
name: PayPay Link Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: paypay-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Scan feeds and notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import hashlib
          import urllib.request
          import feedparser
          from html import unescape

          webhook = os.environ["DISCORD_WEBHOOK"]
          feeds = os.environ.get("RSS_FEEDS", "").splitlines()

          state_file = "seen.json"

          try:
              with open(state_file, encoding="utf-8") as f:
                  seen = set(json.load(f))
          except FileNotFoundError:
              seen = set()

          def send(message):
              data = json.dumps({
                  "content": message
              }).encode("utf-8")

              req = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "PayPayMonitor/1.0"
                  }
              )

              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError("Discord notification failed")

          found = 0

          for feed_url in feeds:
              feed_url = feed_url.strip()

              if not feed_url.startswith("https://"):
                  continue

              try:
                  feed = feedparser.parse(feed_url)

                  for entry in feed.entries:
                      content = unescape(
                          entry.get("title", "") + " " +
                          entry.get("summary", "")
                      )

                      links = re.findall(
                          r'https?://pay\.paypay\.ne\.jp/[^\s<>"\']+',
                          content
                      )

                      for link in set(links):
                          post_url = entry.get("link", "")
                          key = hashlib.sha256(
                              (post_url + link).encode()
                          ).hexdigest()

                          if key in seen:
                              continue

                          send(
                              "PayPayリンクを検出しました\n"
                              f"リンク: {link}\n"
                              f"投稿元: {post_url or feed_url}"
                          )

                          seen.add(key)
                          found += 1

              except Exception as e:
                  print(f"Feed error: {feed_url}: {e}")

          with open(state_file, "w", encoding="utf-8") as f:
              json.dump(sorted(seen), f)

          print(f"Detected: {found}")
          PY

      - name: Save duplicate-check data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (
            git commit -m "Update detected links"
            git push
          )

